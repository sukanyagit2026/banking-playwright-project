[pytest]
pythonpath = .
addopts = --base-url https://parabank.parasoft.com/parabank/ --screenshot only-on-failure --video retain-on-failure --html=report.html --self-contained-html --reruns 1 --reruns-delay 2
testpaths = tests
markers =
    ui: UI tests that drive a real browser
    api: API tests that call REST endpoints directly (no browser)
    smoke: Small, fast subset of tests to run first
